# What reads a pull request's title and description (issue #3): it runs again when they are
# edited, which would be too costly for the build and test jobs of ci.yml. privacy is required on
# dev and main; commit-messages fails on a bad subject; shape only warns.
name: pull-request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every commit of the pull request, and its title (the squashed commit's subject), against
  # AGENTS.md's convention.
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Commit messages (tools/commit-message.sh)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: tools/commit-message.sh --range "$BASE..$HEAD"
      - name: Title of the pull request (tools/commit-message.sh)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          tools/commit-message.sh "$RUNNER_TEMP/title"

  # What the pull request adds, its commit messages, its title and description: no e-mail address
  # outside example.com and example.org, no IBAN but the invented ones, no home path, no word of the
  # private list (the GOUSSET_PRIVATE_WORDS secret, one word a line, never printed).
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Privacy check (tools/privacy-check.sh)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          PRIVATE_WORDS: ${{ secrets.GOUSSET_PRIVATE_WORDS }}
        run: |
          if [ -n "$PRIVATE_WORDS" ]; then
            export GOUSSET_PRIVATE_WORDS="$RUNNER_TEMP/private-words"
            printf '%s\n' "$PRIVATE_WORDS" > "$GOUSSET_PRIVATE_WORDS"
          else
            echo "::warning::The GOUSSET_PRIVATE_WORDS secret is not set or not given to this run: the private words are not checked."
          fi
          printf '%s\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/pull-request"
          status=0
          tools/privacy-check.sh --range "$BASE" "$HEAD" || status=$?
          tools/privacy-check.sh "$RUNNER_TEMP/pull-request" || status=$?
          exit $status

  # A feat or fix that touches the product (apps/, packages/) tells the user what changed with a
  # `Note:` line in its description. Without one this warns; it never fails.
  shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: A note for the user
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          case "$TITLE" in
            feat\(* | feat!* | feat:* | fix\(* | fix!* | fix:*) ;;
            *) echo "Not a feat or fix: no note needed."; exit 0 ;;
          esac
          files=$(git diff --name-only "$BASE...$HEAD")
          if ! grep -qE '^(apps|packages)/' <<< "$files"; then
            echo "Touches neither apps/ nor packages/: no note needed."
            exit 0
          fi
          if grep -qE '^Note: ' <<< "$BODY"; then
            echo "The description has its Note: line."
          else
            echo "::warning::A feat or fix of the product carries a 'Note: <what the user can do now>' line at the start of a line of its description (AGENTS.md)."
          fi
