# A release (docs/releases.md, "Releasing"): the release pull request dev -> main is its review,
# and once the maintainer said yes on it, this workflow is started by hand from dev:
#   gh workflow run release.yml --ref dev -f pull_request=<number>
# (with no pull request only for the first release, while main does not exist). main moves forward
# to the pull request's head, a commit of dev (a fast-forward, never a squash nor a merge of its
# own), and GitHub then shows the pull request merged; that commit's beta image (recorded as
# sha-<commit>) is published again as X.Y.Z and latest, and the GitHub release vX.Y.Z, which makes
# the tag, carries the notes built from the pull requests' `Note:` lines.
#
# Actions are pinned by commit, the version beside it (as in ci.yml).
name: Release

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: The release pull request dev -> main, its number (empty only before the first release, while main does not exist)
        required: false
        default: ""

permissions: {}

# Two releases at once would race for main.
concurrency:
  group: release

env:
  IMAGE: ghcr.io/kristenjestin/gousset

jobs:
  # Reads only: what is released, its version and its notes.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The notes read the pull requests' descriptions.
      pull-requests: read
      # To read the commit's ci run.
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Started from dev, for a pull request
        env:
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          # dev's copy of this workflow is the one that releases: another branch's may say anything.
          if [ "$GITHUB_REF" != refs/heads/dev ]; then
            echo "::error::The release is started from dev, not $GITHUB_REF: nothing was released."
            exit 1
          fi
          if [ -n "$PULL_REQUEST" ] && ! [[ $PULL_REQUEST =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pull_request is the number of the release pull request dev -> main, as 42: nothing was released."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          # Every commit and tag: the version counts from the last release.
          fetch-depth: 0
          persist-credentials: false

      # The commit released is the release pull request's head; before the first release there is
      # no main, so no pull request, and it is dev's head.
      - name: The pull request and its commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          main=
          if git rev-parse -q --verify refs/remotes/origin/main > /dev/null; then
            main=$(git rev-parse refs/remotes/origin/main)
          fi
          if [ -z "$PULL_REQUEST" ]; then
            if [ -n "$main" ]; then
              echo "::error::main exists: a release is a pull request dev -> main, started with -f pull_request=<number>. Nothing was released."
              exit 1
            fi
            sha=$(git rev-parse HEAD)
            echo "::notice::The first release: main is made on dev's head, $sha."
          else
            if [ -z "$main" ]; then
              echo "::error::main does not exist yet: the first release is started with no pull request. Nothing was released."
              exit 1
            fi
            pull=$(gh api "repos/$GH_REPO/pulls/$PULL_REQUEST" \
              --jq '[.state, (.merged | tostring), .base.ref, .head.ref, (.head.repo.full_name // "none"), .head.sha] | join(" ")')
            read -r state merged base head repository sha <<< "$pull"
            if [ "$base" != main ] || [ "$head" != dev ] || [ "$repository" != "$GH_REPO" ]; then
              echo "::error::#$PULL_REQUEST is not a pull request of dev into main: nothing was released."
              exit 1
            fi
            # Merged already: a run again after main moved forward to its head.
            if [ "$state" != open ] && ! { [ "$merged" = true ] && [ "$main" = "$sha" ]; }; then
              echo "::error::#$PULL_REQUEST is closed: nothing was released."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$sha" HEAD 2> /dev/null; then
              echo "::error::The head of #$PULL_REQUEST, $sha, is not a commit of dev: nothing was released."
              exit 1
            fi
            # main is always an ancestor of dev, and only ever moves forward.
            if ! git merge-base --is-ancestor "$main" "$sha"; then
              echo "::error::main is not an ancestor of $sha: main cannot move forward to it, nothing was released."
              exit 1
            fi
            echo "::notice::#$PULL_REQUEST releases $sha."
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # main's ruleset asks for no check: they are enforced here. The beta needs only verify; a
      # release needs the whole ci run of the commit's push to dev (the full matrix of ui and e2e
      # included), and the release pull request's own runs of ci and pull-request (react-doctor,
      # privacy, the commit messages). Each workflow's last run counts, at its last attempt.
      - name: The checks of the commit passed, on dev and on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          passed() { # <workflow file> <event> <what>
            local run status conclusion url
            run=$(gh api "repos/$GH_REPO/actions/workflows/$1/runs?head_sha=$SHA&branch=dev&event=$2" \
              --jq '.workflow_runs | if length == 0 then "none" else (max_by(.run_number) | "\(.status) \(.conclusion // "none") \(.html_url)") end')
            read -r status conclusion url <<< "$run"
            if [ "$status" = none ]; then
              echo "::error::No $1 run of $3 was found: nothing was released."
              return 1
            fi
            if [ "$status" != completed ]; then
              echo "::error::The $1 run of $3 is $status, not finished ($url): nothing was released."
              return 1
            fi
            if [ "$conclusion" != success ]; then
              echo "::error::The $1 run of $3 ended $conclusion, not a success ($url): nothing was released."
              return 1
            fi
            echo "::notice::The $1 run of $3 passed ($url)."
          }
          passed ci.yml push "the push of $SHA to dev"
          if [ -n "$PULL_REQUEST" ]; then
            passed ci.yml pull_request "#$PULL_REQUEST at $SHA"
            passed pull-request.yml pull_request "#$PULL_REQUEST at $SHA"
          fi

      # Computed now, from the releases the commit holds: the version its beta had without the
      # pre-release, unless another release was made since its push.
      - name: The version
        id: version
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          status=0
          version=$(tools/version.sh stable --at "$SHA") || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::error::$SHA is a release already, or nothing was committed since the last one: nothing was released."
            exit 1
          fi
          [ "$status" -eq 0 ] || exit "$status"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::$SHA is released as $version."

      - name: The notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "The image: \`$IMAGE:$VERSION\` (and \`latest\`), the very image the beta of this commit was. Install or update it with \`docker-compose.yml\` (docs/releases.md, \"Installing\")."
            echo
            tools/changelog.sh --at "$SHA"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md
          retention-days: 7

  # Holds the token that writes main, the tags and the images: no checkout, no code of any branch,
  # only `gh` and `docker` on what prepare decided.
  release:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.prepare.outputs.sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Published by beta.yml once verify passed on that commit, under its commit: a release is
      # never built anew, nor taken by a name computed again.
      - name: The image of the commit is published, and the version is not another's
        run: |
          # The digest of a published image; exits 1 when it is not published, 2 when the registry
          # cannot be read.
          digest() {
            local out
            if out=$(docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}' 2>&1); then
              echo "$out"
            elif [[ $out == *": not found"* ]]; then
              return 1
            else
              echo "::error::$1 could not be read: $out" >&2
              return 2
            fi
          }
          status=0
          recorded=$(digest "$IMAGE:sha-$SHA") || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::error::$IMAGE:sha-$SHA, the beta of $SHA, is not published (did verify pass on its push, and its beta run?): nothing was released."
          fi
          [ "$status" -eq 0 ] || exit 1
          # A published version is never replaced: a run again releases the same image or nothing.
          status=0
          named=$(digest "$IMAGE:$VERSION") || status=$?
          [ "$status" -ne 2 ] || exit 1
          if [ "$status" -eq 0 ] && [ "$named" != "$recorded" ]; then
            echo "::error::$IMAGE:$VERSION is published already, as another commit's image than $SHA's: nothing was released."
            exit 1
          fi

      # With the workflow's own token: GitHub refuses it a `git push` that changes
      # .github/workflows, not a ref moved through the API to a commit already in the repository.
      # A ref it moves starts no workflow: main runs no CI of its own (docs/releases.md, "Releasing").
      # GitHub shows the release pull request merged once main is its head.
      - name: Move main forward to the commit
        run: |
          if main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha 2> /dev/null); then
            if [ "$main" = "$SHA" ]; then
              echo "::notice::main is $SHA already."
            else
              # Not forced: GitHub refuses anything but a fast-forward, so nothing is overwritten.
              gh api -X PATCH "repos/$GH_REPO/git/refs/heads/main" -f sha="$SHA" -F force=false > /dev/null
              echo "::notice::main moved forward to $SHA."
            fi
          else
            gh api "repos/$GH_REPO/git/refs" -f ref=refs/heads/main -f sha="$SHA" > /dev/null
            echo "::notice::main made on $SHA."
          fi

      - name: Publish the image as X.Y.Z and latest
        run: |
          # A carbon copy, not an index: the same digest as sha-<commit>.
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" "$IMAGE:sha-$SHA"
          echo "::notice::$IMAGE:$VERSION and latest are the image of $SHA."

      # Last: the release makes the tag, after which the version counts from it.
      - name: The release vX.Y.Z and its tag
        run: |
          gh release create "v$VERSION" --target "$SHA" --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes/notes.md" --latest
