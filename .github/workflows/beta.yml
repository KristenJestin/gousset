# The beta of each push to dev (docs/releases.md, "Betas"): once the `verify` job of that push's
# `ci` run passed, the image ghcr.io/gousset-finance/gousset:X.Y.Z-beta.N, checked by installing it
# as docker-compose.yml does, recorded as sha-<commit>, and the tag `beta` while the commit is still
# dev's head.
#
# Actions are pinned by commit, the version beside it (as in ci.yml).
name: beta

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [dev]

permissions: {}

# No concurrency group: GitHub would cancel a pending run when another queues, and that push would
# never get its beta. Each run publishes its own commit; `beta` moves only to dev's head.

env:
  IMAGE: ghcr.io/gousset-finance/gousset

jobs:
  # The branch's code runs here, with a token that can only read.
  build:
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      # To read the run's jobs.
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: The verify job of the push passed
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          conclusion=$(gh api "repos/$GH_REPO/actions/runs/$RUN/jobs" --paginate --jq '.jobs[] | select(.name == "verify") | .conclusion')
          if [ "$conclusion" = success ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::verify did not pass on this push (${conclusion:-not found}): no beta is published."
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.verified.outputs.passed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Every commit and tag: the version counts from the last release.
          fetch-depth: 0
          persist-credentials: false

      - name: The version
        if: steps.verified.outputs.passed == 'true'
        id: version
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          status=0
          version=$(tools/version.sh beta --at "$SHA") || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::notice::$SHA is a release itself: it has no beta."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "::notice::The beta of $SHA is $version."

      - if: steps.version.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - name: It installs, migrates and answers, as docker-compose.yml runs it
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: tools/check-image.sh "$VERSION"

      - name: Save the image
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: docker save --output "$RUNNER_TEMP/image.tar" "$IMAGE:$VERSION"

      - if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # Holds the token that writes the images: no checkout, no code of any branch, only `docker` and
  # `gh` on the image build made.
  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image

      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/image/image.tar"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish the beta
        run: |
          # The name comes from the branch's code: only a beta's name is ever written here.
          if ! [[ $VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.[1-9][0-9]*$ ]]; then
            echo "::error::'$VERSION' is not a beta's version X.Y.Z-beta.N: nothing was published."
            exit 1
          fi
          # The digest of a published image; exits 1 when it is not published, 2 when the registry
          # cannot be read (never taken for "absent").
          digest() {
            local out
            if out=$(docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}' 2>&1); then
              echo "$out"
            elif [[ $out == *": not found"* ]]; then
              return 1
            else
              echo "::error::$1 could not be read: $out" >&2
              return 2
            fi
          }
          # A carbon copy, not an index: the same digest as its source.
          copy() { docker buildx imagetools create --prefer-index=false --tag "$2" "$1"; }
          status=0
          recorded=$(digest "$IMAGE:sha-$SHA") || status=$?
          [ "$status" -ne 2 ] || exit 1
          named_status=0
          named=$(digest "$IMAGE:$VERSION") || named_status=$?
          [ "$named_status" -ne 2 ] || exit 1
          # sha-<commit> records the image of each commit: the release takes it by that name, and a
          # version is reused only when it is that commit's image. A published version is never
          # replaced.
          if [ "$status" -eq 0 ]; then
            if [ "$named_status" -eq 1 ]; then
              copy "$IMAGE:sha-$SHA" "$IMAGE:$VERSION"
            elif [ "$named" != "$recorded" ]; then
              echo "::error::$IMAGE:$VERSION is another image than the one of $SHA: nothing was published."
              exit 1
            fi
            echo "::notice::The image of $SHA is published already, as $VERSION."
          elif [ "$named_status" -eq 0 ]; then
            echo "::error::$IMAGE:$VERSION is published already, for another commit than $SHA: nothing was published."
            exit 1
          else
            docker tag "$IMAGE:$VERSION" "$IMAGE:sha-$SHA"
            docker push "$IMAGE:sha-$SHA"
            docker push "$IMAGE:$VERSION"
          fi
          # `beta` follows dev's head: a push made since publishes its own.
          head=$(gh api "repos/$GH_REPO/git/ref/heads/dev" --jq .object.sha)
          if [ "$head" = "$SHA" ]; then
            copy "$IMAGE:sha-$SHA" "$IMAGE:beta"
            echo "::notice::$IMAGE:beta is $VERSION."
          else
            echo "::notice::dev moved on to $head: beta is left to its run."
          fi
