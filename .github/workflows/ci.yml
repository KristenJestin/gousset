# Every pull request, and every push to dev and to a next/x.y branch, is verified here (issue #3).
# main runs no CI of its own: the release moves it with the workflow's token, which starts no run,
# to a commit whose run here passed as a whole on its push to dev (docs/releases.md,
# "Releasing"); a push to main by anyone else would run verify alone. What reads a pull request's
# title and description is in pull-request.yml, which runs again when they change. Required on
# dev: verify, ui, e2e and react-doctor here, privacy there. ui and e2e also run on each push to
# dev and next/x.y, so that what a merge breaks there shows at once. A pull request runs them in
# Chromium on a desktop only; dev and next/x.y run every browser and width, and a failure seen only
# there is fixed at once.
#
# Actions are pinned by commit, the version beside it: a moved tag runs no new code here.
name: ci

on:
  pull_request:
  push:
    branches: [dev, "next/**", main]

# A new push makes the runs of the same pull request's older pushes useless. Not on dev, next/x.y
# and main, whose runs always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "26"

jobs:
  # Format, lint, types, unit tests, build, and React Doctor on the whole of apps/web and
  # packages/ui (doctor.config.ts), failing on an error.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format, lint and types (vp check, then each package's check-types)
        run: pnpm run check
      - name: Unit tests (vp test)
        run: pnpm run test
      - name: Build
        run: pnpm run build
      # Nothing leaves CI: no score, no sharing, no supply-chain pass (doctor.config.ts), no
      # telemetry.
      - name: React Doctor, the whole of apps/web and packages/ui
        env:
          REACT_DOCTOR_NO_TELEMETRY: "1"
        run: pnpm exec react-doctor --no-telemetry --yes --blocking error

  # Whether the browser checks cover every browser and width: always off a pull request; on a pull
  # request only when its head commit carries the trailer line `E2E-Matrix: full` (AGENTS.md,
  # "Testing"), as a pull request must before it merges when it touches what other browsers draw.
  scope:
    if: >-
      github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' ||
      startsWith(github.ref, 'refs/heads/next/')
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.read.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read the head commit's trailer
        id: read
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] || git log -1 --format=%B | grep -qx 'E2E-Matrix: full'; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

  # packages/ui's browser checks on Storybook (`pnpm test:ui`): Chromium, Firefox and a phone,
  # screenshots compared, and the lint scenario. They run in the official Playwright image, the
  # one tools/playwright-docker.sh renders the reference screenshots in, so both draw alike. Its
  # version is @playwright/test's in packages/ui/package.json: they move together.
  ui:
    if: >-
      github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' ||
      startsWith(github.ref, 'refs/heads/next/')
    needs: scope
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    env:
      # Firefox refuses a home it does not own, which a runner's container gives it.
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # A pull request runs Chromium and the lint scenario; dev, and a pull request whose head
      # commit asks for it (`scope`), every project.
      - name: Browser checks of packages/ui (Storybook)
        env:
          PROJECTS: ${{ needs.scope.outputs.full != 'true' && '--project=chromium --project=lint' || '' }}
        run: pnpm --filter @gousset/ui test:e2e $PROJECTS
      - name: Keep the report and the screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui
          path: packages/ui/test-results
          if-no-files-found: ignore
          retention-days: 14

  # The end-to-end suite (apps/e2e), sharded. Until the harness lands there is no `e2e` script,
  # and each shard passes saying so. A pull request runs the chromium-desktop project only, dev
  # (and a pull request whose head commit asks for it, `scope`) every project
  # (apps/e2e/playwright.config.ts).
  e2e-shard:
    name: e2e shard ${{ matrix.shard }}
    if: >-
      github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' ||
      startsWith(github.ref, 'refs/heads/next/')
    needs: scope
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gousset
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_BROWSERS: ${{ needs.scope.outputs.full == 'true' && 'chromium firefox' || 'chromium' }}
      E2E_PROJECTS: ${{ needs.scope.outputs.full != 'true' && '--project=chromium-desktop' || '' }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gousset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Is there a suite to run
        id: harness
        run: |
          if [ "$(node -p "Boolean(require('./package.json').scripts.e2e)")" != true ]; then
            echo "::notice::No e2e script yet (the harness is its own ticket): nothing to run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Playwright's browsers
        if: steps.harness.outputs.present == 'true'
        run: pnpm --dir apps/e2e exec playwright install --with-deps $E2E_BROWSERS
      # The suite runs the built app.
      - name: Build
        if: steps.harness.outputs.present == 'true'
        run: pnpm run build
      - name: End-to-end tests, shard ${{ matrix.shard }} of 2
        if: steps.harness.outputs.present == 'true'
        run: pnpm e2e --shard=${{ matrix.shard }}/2 $E2E_PROJECTS
      - name: Keep the trace, video and screenshots
        if: failure() && steps.harness.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            apps/e2e/test-results
            apps/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14
      # The pictures a scenario takes on purpose (`testInfo.outputPath("screens", …)`), kept
      # whatever the result: the screens shown in the pull request.
      - name: Keep the screens' pictures
        if: always() && steps.harness.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screens-shard-${{ matrix.shard }}
          path: apps/e2e/test-results/**/screens/*.png
          if-no-files-found: ignore
          retention-days: 14

  # The monthly review's four motions filmed in Chromium, light and dark, desktop and phone (issue
  # #10): the `motion-*` projects of apps/e2e, whose every test records a video. The videos are
  # kept as the `motion-recordings` artifact of the run, whatever its result. Not a required check.
  motion:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gousset
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gousset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Playwright's browser
        run: pnpm --dir apps/e2e exec playwright install --with-deps chromium
      - name: Build
        run: pnpm run build
      - name: Film the motions
        run: >-
          pnpm e2e --project=motion-desktop-light --project=motion-desktop-dark
          --project=motion-phone-light --project=motion-phone-dark
      - name: Keep the films
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: motion-recordings
          path: apps/e2e/test-results/**/*.webm
          if-no-files-found: warn
          retention-days: 30

  # The Redact comparison of issue #10 (docs/architecture.md, "Redact"): the review's scenarios,
  # its four motions and its chart among them, in Chromium and Firefox, on the app built on React and
  # on Redact (`GOUSSET_REDACT=1`), then the four motions filmed (Chromium). The report, the films
  # and a failure's trace are the `redact-<runtime>` artifacts. Not a required check: the app ships
  # on React. It runs on a pull request whose head commit asks for every browser (`scope`), to
  # compare again once Firefox runs the review (docs/architecture.md, "Redact").
  redact:
    name: redact (${{ matrix.runtime }})
    if: github.event_name == 'pull_request' && needs.scope.outputs.full == 'true'
    needs: scope
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [react, redact]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gousset
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gousset
      GOUSSET_REDACT: ${{ matrix.runtime == 'redact' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Playwright's browsers
        run: pnpm --dir apps/e2e exec playwright install --with-deps chromium firefox
      - name: Build
        run: pnpm run build
      - name: The review's scenarios, Chromium and Firefox
        run: >-
          pnpm e2e tests/review.spec.ts tests/data-loading.spec.ts
          --project=chromium-desktop --project=firefox-desktop --output=test-results/scenarios
      - name: The four motions, filmed
        if: always()
        run: >-
          pnpm e2e --project=motion-desktop-light --project=motion-desktop-dark
          --project=motion-phone-light --project=motion-phone-dark --output=test-results/motions
      - name: Keep the films and the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redact-${{ matrix.runtime }}
          path: |
            apps/e2e/test-results
            apps/e2e/playwright-report
          if-no-files-found: warn
          retention-days: 14

  # The required check: one job named e2e that passes only when every shard passed, whatever the
  # number of shards.
  e2e:
    if: >-
      always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' ||
      startsWith(github.ref, 'refs/heads/next/'))
    needs: e2e-shard
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "The shards: $RESULT"
          [ "$RESULT" = success ]

  # React Doctor on what the pull request introduces, through its official Action: one summary
  # comment kept up to date and inline comments on the changed lines. An error fails the check; a
  # warning stays a comment to answer. Its settings (projects, no score, no sharing, no
  # supply-chain pass) are in doctor.config.ts. Its job holds a token that writes comments, and no
  # more: no commit status, no credentials left in .git.
  react-doctor:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # The whole history: the Action diffs the pull request against its base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # The installed react-doctor runs, at the version of the lockfile, and doctor.config.ts
      # resolves its import.
      - name: Install
        run: pnpm install --frozen-lockfile
      # The Action passes no --no-telemetry: the variable turns it off.
      - uses: millionco/react-doctor@695e46eee203a5d1855020191aa7e9c010a1250e # v2
        env:
          REACT_DOCTOR_NO_TELEMETRY: "1"
        with:
          blocking: error
          commit-status: false
          # The Action's default, "*", would scan every workspace project: these are doctor.config.ts's.
          project: apps/web,packages/ui
          node-version: ${{ env.NODE_VERSION }}
