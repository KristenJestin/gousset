# Every pull request, and every push to dev and main, is verified here (issue #3).
# Required on dev and main: verify, e2e, react-doctor and privacy. commit-messages and shape speak
# too; shape only warns.
name: ci

on:
  pull_request:
  push:
    branches: [dev, main]

# A new push makes the runs of the same pull request's older pushes useless. Not on dev and main,
# whose runs always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "26"

jobs:
  # Format, lint, types, unit tests, build, and React Doctor on the whole of apps/web and
  # packages/ui (doctor.config.ts), failing on an error.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format, lint and types (vp check, then each package's check-types)
        run: pnpm run check
      - name: Unit tests (vp test)
        run: pnpm run test
      - name: Build
        run: pnpm run build
      # Nothing leaves CI: no score, no sharing, no supply-chain pass (doctor.config.ts), no
      # telemetry.
      - name: React Doctor, the whole of apps/web and packages/ui
        run: pnpm exec react-doctor --no-telemetry --yes --blocking error

  # The end-to-end suite (apps/e2e, its own ticket), sharded. Until the harness lands there is no
  # `e2e` script, and the job passes saying so.
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gousset
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gousset
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Is there a suite to run
        id: harness
        run: |
          if [ "$(node -p "Boolean(require('./package.json').scripts.e2e)")" != true ]; then
            echo "::notice::No e2e script yet (the harness is its own ticket): nothing to run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Playwright's browsers
        if: steps.harness.outputs.present == 'true'
        run: pnpm --dir apps/e2e exec playwright install --with-deps chromium firefox
      - name: End-to-end tests, shard ${{ matrix.shard }} of 2
        if: steps.harness.outputs.present == 'true'
        run: pnpm e2e --shard=${{ matrix.shard }}/2
      - name: Keep the trace, video and screenshots
        if: failure() && steps.harness.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            apps/e2e/test-results
            apps/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  # React Doctor on what the pull request introduces, through its official Action: one summary
  # comment kept up to date and inline comments on the changed lines. An error fails the check; a
  # warning stays a comment to answer. Its settings (projects, no score, no sharing, no
  # supply-chain pass) are in doctor.config.ts.
  react-doctor:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      # The whole history: the Action diffs the pull request against its base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # The installed react-doctor runs, at the version of the lockfile, and doctor.config.ts
      # resolves its import.
      - name: Install
        run: pnpm install --frozen-lockfile
      - uses: millionco/react-doctor@v2
        with:
          blocking: error
          node-version: ${{ env.NODE_VERSION }}

  # Every commit of the pull request, and its title (the squashed commit's subject), against
  # AGENTS.md's convention.
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Commit messages (tools/commit-message.sh)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: tools/commit-message.sh --range "$BASE..$HEAD"
      - name: Title of the pull request (tools/commit-message.sh)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          tools/commit-message.sh "$RUNNER_TEMP/title"

  # What the pull request adds, its commit messages, its title and description: no e-mail address
  # outside example.com and example.org, no IBAN but the invented ones, no home path, no word of the
  # private list (the GOUSSET_PRIVATE_WORDS secret, one word a line, never printed).
  privacy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Privacy check (tools/privacy-check.sh)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          PRIVATE_WORDS: ${{ secrets.GOUSSET_PRIVATE_WORDS }}
        run: |
          if [ -n "$PRIVATE_WORDS" ]; then
            export GOUSSET_PRIVATE_WORDS="$RUNNER_TEMP/private-words"
            printf '%s\n' "$PRIVATE_WORDS" > "$GOUSSET_PRIVATE_WORDS"
          else
            echo "::warning::The GOUSSET_PRIVATE_WORDS secret is not set or not given to this run: the private words are not checked."
          fi
          printf '%s\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/pull-request"
          status=0
          tools/privacy-check.sh --range "$BASE" "$HEAD" || status=$?
          tools/privacy-check.sh "$RUNNER_TEMP/pull-request" || status=$?
          exit $status

  # A feat or fix that touches the product (apps/, packages/) tells the user what changed with a
  # `Note:` line in its description. Without one this warns; it never fails.
  shape:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: A note for the user
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          case "$TITLE" in
            feat\(* | feat!* | feat:* | fix\(* | fix!* | fix:*) ;;
            *) echo "Not a feat or fix: no note needed."; exit 0 ;;
          esac
          files=$(git diff --name-only "$BASE...$HEAD")
          if ! grep -qE '^(apps|packages)/' <<< "$files"; then
            echo "Touches neither apps/ nor packages/: no note needed."
            exit 0
          fi
          if grep -qE '^Note: ' <<< "$BODY"; then
            echo "The description has its Note: line."
          else
            echo "::warning::A feat or fix of the product carries a 'Note: <what the user can do now>' line at the start of a line of its description (AGENTS.md)."
          fi
