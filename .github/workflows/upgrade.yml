# Every commit is tested as an update of the last release (issue #102, docs/releases.md, "Every
# release is an upgrade"): the release's image, filled with invented data, then this commit's image
# in its place, as tools/check-upgrade.sh describes. The Release workflow refuses a commit whose
# push to dev did not pass this job.
#
# Actions are pinned by commit, the version beside it (as in ci.yml).
name: upgrade

on:
  pull_request:
  push:
    branches: [dev, "next/**"]

# A new push makes the runs of the same pull request's older pushes useless. Not on a branch, whose
# runs always finish: the release reads dev's.
concurrency:
  group: upgrade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The release reads this job by its name: renaming it means changing release.yml with it.
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags: the last release, its compose file and its migrations.
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ghcr.io/kristenjestin/gousset:upgrade

      - name: The last release updates to it, losing and changing nothing
        run: tools/check-upgrade.sh upgrade
