packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@8.3.8000
# Versions shared by several packages. Renovate keeps them current (renovate.json).
catalog:
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  better-auth: 1.7.27
  drizzle-orm: 1.0.0-rc.6
  effect: ^4.1.5
  fast-check: 4.10.3
  react: ^19.3.1
  react-dom: ^19.3.1
  storybook: ^10.6.8
  tailwindcss: ^4.3.5
  typescript: ^7.0.2
  varlock: 1.25.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
# Exact versions only: the latest of each on 2026-11-22, newer than pnpm's minimum release age.
# Each line can go once its version is older than that age.
minimumReleaseAgeExclude:
  - "@tanstack/hotkeys@0.33.1"
  - "@tanstack/react-hotkeys@0.27.2"
  - "@tanstack/hotkeys-devtools@1.11.4"
  - "@tanstack/react-hotkeys-devtools@0.14.14"
# Exact versions only. motion-dom@14.14.0: its WAAPI start times are put on the animation's
# timeline, which in Firefox can trail performance.now() by seconds and delay every fade (#167).
# A Renovate bump of motion or motion-dom must re-apply this patch to the new version, or drop it
# once upstream fixes it; until then it applies to 14.14.0 alone.
# @ui-sdk/core@0.1.0-beta.13: while a sheet or a dialog closes, a press where its backdrop was is
# eaten only when a press on that backdrop closed it, less than a double click ago (#259); a bump
# of @ui-sdk/core or @ui-sdk/react must re-apply it the same way, or drop it once upstream fixes it.
patchedDependencies:
  "@ui-sdk/core@0.1.0-beta.13": patches/@ui-sdk__core@0.1.0-beta.13.patch
  motion-dom@14.14.0: patches/motion-dom@14.14.0.patch
