name: gousset

# Self-hosting: set POSTGRES_PASSWORD (and BETTER_AUTH_SECRET, BETTER_AUTH_URL in apps/web/.env)
# before `pnpm docker:up`. `pnpm db:start` alone (local development) falls back to `password`,
# reachable from this machine only.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      # Container networking only: the database is the `postgres` service.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/gousset
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Through better-auth, so that a server unable to start auth (no secret) is unhealthy.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/auth/ok').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: gousset-postgres
    environment:
      POSTGRES_DB: gousset
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      # This machine only: the database is never published on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - gousset_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  gousset_postgres_data:
