# Gousset at home (docs/releases.md, "Installing"): Postgres 18, the `migrate` one-shot, then the
# app on http://localhost:3001. The secrets are files of ./secrets, made once:
#
#   mkdir -p secrets
#   openssl rand -hex 32 > secrets/postgres_password
#   echo "postgresql://gousset:$(cat secrets/postgres_password)@postgres:5432/gousset" > secrets/database_url
#   openssl rand -base64 32 > secrets/better_auth_secret
#   docker compose up -d
#
# Variables, from the shell or a .env file beside this one:
#   GOUSSET_VERSION              the image's tag: latest (the last release), beta, or a version
#   BETTER_AUTH_URL              the address the app is reached at (http://localhost:3001)
#   GOUSSET_PORT                 the port it is published on (3001)
#   OTEL_EXPORTER_OTLP_ENDPOINT  a collector of yours: telemetry is off while it is not set
name: gousset

x-gousset: &gousset
  image: ghcr.io/kristenjestin/gousset:${GOUSSET_VERSION:-latest}
  # In a clone of the repository, `docker compose up --build` builds the image instead.
  build: .
  init: true

services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_DB: gousset
      POSTGRES_USER: gousset
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      # Over TCP: while the database is first made, a server of its own answers on the socket only,
      # then stops; migrate must wait for the real one.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "gousset", "-d", "gousset"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *gousset
    command: migrate
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *gousset
    environment:
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      DATABASE_URL_FILE: /run/secrets/database_url
      # Passed on only when set: unset, the app sends no telemetry.
      OTEL_EXPORTER_OTLP_ENDPOINT:
    secrets:
      - better_auth_secret
      - database_url
    ports:
      - "${GOUSSET_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  better_auth_secret:
    file: ./secrets/better_auth_secret

volumes:
  postgres:
