# Gousset at home (docs/releases.md, "Installing"): Postgres 18, the `migrate` one-shot, then the
# app on http://localhost:3001. The secrets are files of ./secrets, both required, made once:
#
#   mkdir -p secrets
#   openssl rand -base64 32 > secrets/postgres_password
#   openssl rand -base64 32 > secrets/better_auth_secret
#   docker compose up -d
#
# Postgres takes its password when its volume is first made, and only then: to change it later,
# change it in the database too (docs/releases.md, "Changing the database password").
#
# The roles: POSTGRES_USER owns the tables and runs `migrate`; the migrations make `gousset_app`,
# which the app logs in as, with a password `migrate` derives from this one (docs/data-model.md,
# "Ownership and isolation"). Both services are given the owner's URL: nothing else to make.
#
# Variables, from the shell or a .env file beside this one:
#   GOUSSET_VERSION              the image's tag: latest (the last release), beta, or a version
#   BETTER_AUTH_URL              the address the app is reached at (http://localhost:3001)
#   GOUSSET_PORT                 the port it is published on (3001)
#   OTEL_EXPORTER_OTLP_ENDPOINT  a collector of yours: telemetry is off while it is not set
name: gousset

x-gousset: &gousset
  image: ghcr.io/gousset-finance/gousset:${GOUSSET_VERSION:-latest}
  # In a clone of the repository, `docker compose up --build` builds the image instead.
  build: .
  init: true

services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_DB: gousset
      POSTGRES_USER: gousset
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      # Over TCP: while the database is first made, a server of its own answers on the socket only,
      # then stops; migrate must wait for the real one.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "gousset", "-d", "gousset"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *gousset
    command: migrate
    # The password apart: the image puts it into the URL percent-encoded, whatever it holds. The
    # app turns the owner's URL into gousset_app's and never logs in as the owner.
    environment: &database
      DATABASE_URL: postgresql://gousset@postgres:5432/gousset
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *gousset
    environment:
      <<: *database
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      # Passed on only when set: unset, the app sends no telemetry.
      OTEL_EXPORTER_OTLP_ENDPOINT:
    secrets:
      - better_auth_secret
      - postgres_password
    ports:
      - "${GOUSSET_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  better_auth_secret:
    file: ./secrets/better_auth_secret

volumes:
  postgres:
