# The database of development (`pnpm db:start`), reachable from this machine only (127.0.0.1:5432).
# POSTGRES_PASSWORD falls back to the one the defaults of apps/web/.env.schema expect. Not for an
# installation: that is docker-compose.yml, whose secrets are required.
name: gousset-dev

services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_DB: gousset
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "gousset"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres:
